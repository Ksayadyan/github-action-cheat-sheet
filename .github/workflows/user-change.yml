name: xtaac deployment
on:
  push:
    branches:
      - main
jobs:
  auto-deploy-lambda:
    runs-on: [ubuntu-latest]
    steps:
    - name: Set up WireGuard Connection
      uses: niklaskeerl/easy-wireguard-action@v2
      with:
        WG_CONFIG_FILE: ${{ secrets.VOID }}
    - name: install depsendencies
      run: npm ci
